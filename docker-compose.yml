version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estateiq-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chromadb
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - estateiq_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - estateiq_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: estateiq-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - estateiq_net

volumes:
  estateiq_data:
    driver: local

networks:
  estateiq_net:
    driver: bridge
